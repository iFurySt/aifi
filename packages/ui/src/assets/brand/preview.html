<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AIFi · Brand assets</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:48px;background:#f0f0f0;color:#202020;font-family:system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto}h1{font-size:28px;letter-spacing:-1px;margin:0 0 32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}figure{margin:0;border:1px solid #e3e3e3;background:white;border-radius:20px;padding:24px}.sample{height:180px;display:grid;place-items:center;border-radius:14px;background:#f8f8f8}.sample.dark{background:#202020}.sample img{width:132px;height:132px;object-fit:contain}figcaption{font-size:14px;margin-top:20px;color:#636363}@media(max-width:650px){body{padding:24px}.grid{grid-template-columns:repeat(2,1fr)}.sample{height:140px}.sample img{width:104px;height:104px}}
</style>
</head>
<body><main><h1>AIFi</h1><div class="grid">
<figure><div class="sample"><img src="symbol-black.svg" alt="Black AIFi mark" /></div><figcaption>Black · transparent</figcaption></figure>
<figure><div class="sample dark"><img src="symbol-white.svg" alt="White AIFi mark" /></div><figcaption>White · transparent</figcaption></figure>
<figure><div class="sample"><img src="symbol-green.svg" alt="Green AIFi mark" /></div><figcaption>Green · transparent</figcaption></figure>
<figure><div class="sample"><img src="symbol-on-light.svg" alt="AIFi light tile" /></div><figcaption>Light background</figcaption></figure>
<figure><div class="sample"><img src="symbol-on-green.svg" alt="AIFi green tile" /></div><figcaption>Green background</figcaption></figure>
<figure><div class="sample"><img src="app-icon-512.png" alt="AIFi app icon" /></div><figcaption>App icon</figcaption></figure>
</div></main></body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIFi · Stock workspace</title>
    <style>
      body { font: 14px system-ui; margin: 64px; color: #202020; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <p>The stock preview now uses the shared Web/Electron app.</p>
    <p><a id="workspace" href="http://127.0.0.1:5173/#/stocks/AAPL?tab=chart">Open stock workspace</a></p>
    <p>Start it with <code>pnpm dev</code> or <code>pnpm dev:desktop</code>.</p>
    <script>
      const requested = location.hash.slice(1);
      const tab = ["chart", "financials", "funds", "politicians", "insiders", "analyst"].includes(requested) ? requested : "chart";
      const target = `http://127.0.0.1:5173/#/stocks/AAPL?tab=${tab}`;
      document.getElementById("workspace").href = target;
      location.replace(target);
    </script>
  </body>
</html>
